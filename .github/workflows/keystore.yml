name: Keystore olustur

on:
  workflow_dispatch:

jobs:
  ks:
    runs-on: ubuntu-latest
    steps:
      - name: Keystore uret
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.jks -alias fotoproje \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Ganyan Sosyal, O=Ganyan Sosyal, C=TR"
          {
            echo "KEY_ALIAS=fotoproje"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64="
            base64 -w0 release.jks
            echo
          } > keystore-bilgi.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-bilgi
          path: |
            keystore-bilgi.txt
            release.jks
