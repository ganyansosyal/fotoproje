name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android klasorunu olustur
        run: flutter create --platforms=android --project-name fotoproje --org com.ganyansosyal .

      - name: Ses+video birlestirici (MediaMuxer) ekle
        run: |
          D=android/app/src/main/kotlin/com/ganyansosyal/fotoproje
          mkdir -p $D
          cat > $D/MainActivity.kt <<'EOF'
          package com.ganyansosyal.fotoproje

          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.nio.ByteBuffer

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mux")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "merge") {
                              val v = call.argument<String>("video")!!
                              val a = call.argument<String>("audio")!!
                              val o = call.argument<String>("out")!!
                              Thread {
                                  try {
                                      merge(v, a, o)
                                      runOnUiThread { result.success(true) }
                                  } catch (e: Exception) {
                                      runOnUiThread { result.error("mux", e.toString(), null) }
                                  }
                              }.start()
                          } else {
                              result.notImplemented()
                          }
                      }
              }

              private fun pick(x: MediaExtractor, prefix: String): Int {
                  for (i in 0 until x.trackCount) {
                      val m = x.getTrackFormat(i).getString(MediaFormat.KEY_MIME)
                      if (m != null && m.startsWith(prefix)) return i
                  }
                  return -1
              }

              private fun copy(x: MediaExtractor, mux: MediaMuxer, track: Int) {
                  val buf = ByteBuffer.allocate(4 * 1024 * 1024)
                  val info = MediaCodec.BufferInfo()
                  while (true) {
                      buf.clear()
                      val n = x.readSampleData(buf, 0)
                      if (n < 0) break
                      info.offset = 0
                      info.size = n
                      info.presentationTimeUs = x.sampleTime
                      info.flags = if ((x.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC) != 0)
                          MediaCodec.BUFFER_FLAG_SYNC_FRAME else 0
                      mux.writeSampleData(track, buf, info)
                      x.advance()
                  }
              }

              private fun merge(video: String, audio: String, out: String) {
                  val vx = MediaExtractor()
                  vx.setDataSource(video)
                  val ax = MediaExtractor()
                  ax.setDataSource(audio)
                  val vt = pick(vx, "video/")
                  val at = pick(ax, "audio/")
                  if (vt < 0 || at < 0) throw Exception("video veya ses izi bulunamadi")
                  vx.selectTrack(vt)
                  ax.selectTrack(at)
                  val mux = MediaMuxer(out, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  val vo = mux.addTrack(vx.getTrackFormat(vt))
                  val ao = mux.addTrack(ax.getTrackFormat(at))
                  mux.start()
                  copy(vx, mux, vo)
                  copy(ax, mux, ao)
                  mux.stop()
                  mux.release()
                  vx.release()
                  ax.release()
              }
          }
          EOF

      - name: INTERNET izni ekle
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Skia motoruna gec (Impeller kapali)
        run: |
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "Impeller" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: inappwebview Proguard hatasini yamala
        run: |
          for f in $HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            echo "Yamalaniyor: $f"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
            grep -n "proguard" "$f" || true
          done

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tarayici-apk
          path: build/app/outputs/flutter-apk/app-release.apk
