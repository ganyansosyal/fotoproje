name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon > build.log 2>&1
          code=$?
          echo "=========== HATA OZETI ==========="
          grep -E "^e: |What went wrong|Could not|error:" -A4 build.log | head -60
          echo "=========== OZET SONU ==========="
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: tarayici-apk
          path: app/build/outputs/apk/release/app-release.apk
