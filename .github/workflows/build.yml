name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android klasorunu olustur
        run: flutter create --platforms=android --project-name fotoproje --org com.ganyansosyal .

      - name: INTERNET izni ekle
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: inappwebview Proguard hatasini yamala
        run: |
          for f in $HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            echo "Yamalaniyor: $f"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
            grep -n "proguard" "$f" || true
          done

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tarayici-apk
          path: build/app/outputs/flutter-apk/app-release.apk
